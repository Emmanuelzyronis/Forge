services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: forge
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge -d forge"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:v4.17.1
    volumes:
      - ../migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://forge:forge@postgres:5432/forge?sslmode=disable"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  forge-api:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      FORGE_DATABASE_URL: postgres://forge:forge@postgres:5432/forge?sslmode=disable
      FORGE_LISTEN_ADDR: ":8080"
      FORGE_LEASE_DURATION_SECS: "30"
      FORGE_RECOVERY_INTERVAL_SECS: "10"
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: on-failure

  forge-worker:
    build:
      context: ..
      dockerfile: Dockerfile.worker
    environment:
      FORGE_API_URL: http://forge-api:8080
      FORGE_POLL_INTERVAL_SECS: "1"
      FORGE_HEARTBEAT_INTERVAL_SECS: "10"
    depends_on:
      forge-api:
        condition: service_started
    restart: on-failure
    deploy:
      replicas: 2

volumes:
  postgres_data:
